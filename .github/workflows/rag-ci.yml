name: rag-ci

on:
  pull_request:
    paths:
      - "02-rag-app/**"
      - ".github/workflows/rag-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 02-rag-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-rag-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Build chunks
        run: python chunker.py

      - name: Unit tests
        run: python -m unittest -q