name: deployyyyy

on:
  push:
    branches: [main]
    paths:
      - "01-serverless-ingestion/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-north-1
    defaults:
      run:
        working-directory: 01-serverless-ingestion/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve

  plan-prod:
    needs: deploy-dev
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PLAN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PLAN_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-north-1
    defaults:
      run:
        working-directory: 01-serverless-ingestion/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color | tee plan.txt

      - name: Show plan in job summary
        if: always()
        run: |
          {
            echo "### Terraform plan (envs/prod), review before approving"
            echo '~~~'
            cat plan.txt 2>/dev/null || echo "no plan output"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    needs: plan-prod
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-north-1
    defaults:
      run:
        working-directory: 01-serverless-ingestion/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve